[project]
name = "clef-extractor"
version = "0.1.0"
description = "Extract PDF fields with an LLM, validated locally by clef-flash"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.scripts]
clef-extract = "clef_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clef_extractor"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "clef: needs local Ollama with clef-flash:9b",
    "e2e: needs Ollama signed in (cloud extractor) and clef-flash:9b",
]
addopts = "-m 'not clef and not e2e'"
filterwarnings = ["ignore:builtin type .*swig.* has no __module__ attribute:DeprecationWarning"]
